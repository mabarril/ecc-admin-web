services:
  ecc-db:
    image: postgres:17-alpine
    container_name: ecc-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ecc_db}
    expose:
      - "5432"
    volumes:
      - ecc_pgdata:/var/lib/postgresql/data
    networks:
      - ecc-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecc_user} -d ${POSTGRES_DB:-ecc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ecc-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ecc-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecc_user}:${POSTGRES_PASSWORD:-ecc_pass}@ecc-db:5432/${POSTGRES_DB:-ecc_db}
      USE_IN_MEMORY_DB: ${USE_IN_MEMORY_DB:-false}
      JWT_SECRET: ${JWT_SECRET:-ecc-prod-secret-change-me-with-at-least-32-chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      PUBLIC_FORM_BASE_URL: ${PUBLIC_FORM_BASE_URL:-https://eccbsb.org.br/inscricao}
    expose:
      - "3000"
    depends_on:
      ecc-db:
        condition: service_healthy
    networks:
      - ecc-network

  ecc-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecc-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    depends_on:
      - ecc-api
    networks:
      - ecc-network

volumes:
  ecc_pgdata:

networks:
  ecc-network:
    driver: bridge
