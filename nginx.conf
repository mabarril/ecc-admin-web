server {
    listen 80;
    server_name localhost;

    # Oculta versão do servidor Nginx (CIS Nginx Benchmark 2.5.1)
    server_tokens off;
    client_max_body_size 1m;

    # Security Headers globais (OWASP Secure Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://viacep.com.br; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Endpoint de healthcheck para Docker / Load Balancers
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compressão Gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy para o container ecc-api na rede interna do Docker
    location /api/ {
        proxy_pass http://ecc-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }
}
