services:
  ecc-api-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      USE_IN_MEMORY_DB: "true"
      JWT_SECRET: ecc-dev-secret-2026
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
    networks:
      - ecc-dev-net

  ecc-web-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 4200"
    environment:
      VITE_API_TARGET: http://ecc-api-dev:3000
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
    depends_on:
      - ecc-api-dev
    networks:
      - ecc-dev-net

networks:
  ecc-dev-net:
    driver: bridge
